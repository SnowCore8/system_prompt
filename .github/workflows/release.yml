name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: 安装校验依赖
        run: python3 -m pip install --require-hashes -r requirements-dev.txt
      - name: 安装 JS 开发依赖
        run: npm ci
      - name: 全量校验
        run: ./scripts/check.sh
      - name: 校验 tag 与 manifest 版本一致
        run: |
          python3 - <<'PY'
          import json, os
          versions = {
              "qoder": json.load(open("plugins/qoder/.qoder-plugin/plugin.json", encoding="utf-8"))["version"],
              "qwen": json.load(open("plugins/qwen/qwen-extension.json", encoding="utf-8"))["version"],
              "dsh": json.load(open("package.json", encoding="utf-8"))["version"],
              "npm-qoder": json.load(open("npm/qoder/package.json", encoding="utf-8"))["version"],
              "npm-qwen": json.load(open("npm/qwen/package.json", encoding="utf-8"))["version"],
          }
          tag = os.environ["GITHUB_REF_NAME"]
          if len(set(versions.values())) != 1:
              raise SystemExit(f"发布包版本不一致: {versions}")
          version = versions["qoder"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} 与清单版本 v{version} 不一致")
          PY
      # runner 没有 qoderclicn，插件校验在本地发布前完成；此处用 --no-validate 换取可重复构建
      - name: 构建制品
        run: ./scripts/dist.sh --no-validate --require-tag
      - name: 清理 JS 依赖
        run: rm -rf node_modules
      - name: 生成 SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json
      - name: 生成构建来源证明
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: |
            global-user-constraints-*.zip
            global-user-constraints-*.sha256
            sbom.spdx.json
      - name: 校验构建来源证明
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in global-user-constraints-*.zip sbom.spdx.json; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done
      - name: 准备三个 npm 包
        run: |
          scripts/materialize.sh dsh /tmp/npm-dsh
          for p in qoder qwen; do
            mkdir -p "/tmp/npm-$p"
            cp "npm/$p/package.json" "npm/$p/README.md" "/tmp/npm-$p/"
            cp global-user-constraints-$p-*.zip global-user-constraints-$p-*.sha256 "/tmp/npm-$p/"
            cp LICENSE LICENSE-CC-BY-4.0.txt LICENSE-MIT.txt THIRD-PARTY-NOTICES.md "/tmp/npm-$p/"
          done
      - name: 发布三个 npm 包
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in dsh qoder qwen; do
            npm publish "/tmp/npm-$p" --access public --provenance
          done
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            global-user-constraints-*.zip \
            global-user-constraints-*.sha256 \
            THIRD-PARTY-NOTICES.md \
            sbom.spdx.json \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
