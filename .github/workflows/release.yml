name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - name: 安装校验依赖
        run: python3 -m pip install -r requirements-dev.txt
      - name: 全量校验
        run: ./scripts/check.sh
      - name: 校验 tag 与 manifest 版本一致
        run: |
          python3 - <<'PY'
          import json, os
          versions = {
              "qoder": json.load(open("plugins/qoder/.qoder-plugin/plugin.json", encoding="utf-8"))["version"],
              "qwen": json.load(open("plugins/qwen/qwen-extension.json", encoding="utf-8"))["version"],
              "dsh": json.load(open("package.json", encoding="utf-8"))["version"],
              "npm-qoder": json.load(open("npm/qoder/package.json", encoding="utf-8"))["version"],
          }
          tag = os.environ["GITHUB_REF_NAME"]
          if len(set(versions.values())) != 1:
              raise SystemExit(f"发布包版本不一致: {versions}")
          version = versions["qoder"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} 与清单版本 v{version} 不一致")
          PY
      # runner 没有 qoderclicn，插件校验在本地发布前完成；此处用 --no-validate 换取可重复构建
      - name: 构建制品
        run: ./scripts/dist.sh --no-validate --require-tag
      - name: 组装 DSH 包
        run: scripts/materialize.sh dsh /tmp/dsh-package
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: 发布 DSH bundle 到 npm
        working-directory: /tmp/dsh-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
      - name: 准备 Qoder npm 包
        run: |
          mkdir -p /tmp/qoder-npm
          cp npm/qoder/package.json npm/qoder/README.md /tmp/qoder-npm/
          cp global-user-constraints-qoder-*.zip global-user-constraints-qoder-*.sha256 /tmp/qoder-npm/
          cp LICENSE LICENSE-CC-BY-4.0.txt LICENSE-MIT.txt THIRD-PARTY-NOTICES.md /tmp/qoder-npm/
      - name: 发布 Qoder 安装包到 npm
        working-directory: /tmp/qoder-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
      - name: 生成 SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            global-user-constraints-*.zip \
            global-user-constraints-*.sha256 \
            THIRD-PARTY-NOTICES.md \
            sbom.spdx.json \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
